site_name: fairfig
site_description: Colour-blind-safe, journal-ready matplotlib figures with one consistent visual identity
site_url: https://usosky.github.io/fairfig/
site_author: Denis Usosky
repo_url: https://github.com/usosky/fairfig
repo_name: usosky/fairfig
edit_uri: edit/main/docs/
copyright: >-
  MIT © 2026 Denis Usosky ·
  Co-funded by the European Union (Marie Skłodowska-Curie Grant Agreement No 101177949)

theme:
  name: material
  font: false                      # system fonts: no request to Google Fonts
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: table
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Colour: guide/colour.md
      - Figures, marks and text: guide/figures.md
      - Saving: guide/saving.md
  - Cookbook: cookbook.md
  - API reference: api.md
  - Cite and acknowledge: citing.md
  - Changelog: changelog.md
  - Development: development.md
